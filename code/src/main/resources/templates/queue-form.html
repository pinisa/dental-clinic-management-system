<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนจองคิว - DentalProtect</title>
    <!-- Bootstrap 5 & Google Fonts & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f8f6f9;
            color: #2b2b2b;
        }
        .navbar-custom {
            background-color: #1b2a4a;
        }
        .brand-title {
            color: #ffffff;
            font-weight: 600;
            font-size: 1.35rem;
        }
        .contact-info {
            color: #d1d5db;
            font-size: 0.88rem;
        }
        .card-form {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(27, 42, 74, 0.08);
            background: #ffffff;
            overflow: hidden;
        }
        .card-header-custom {
            background-color: #1b2a4a;
            color: #ffffff;
            padding: 24px;
            text-align: center;
        }
        .form-label {
            font-weight: 500;
            color: #1b2a4a;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
        }
        .form-control:focus, .form-select:focus {
            border-color: #1b2a4a;
            box-shadow: 0 0 0 0.25rem rgba(27, 42, 74, 0.15);
        }
        .btn-submit {
            background-color: #1b2a4a;
            color: #ffffff;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 500;
            width: 100%;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            background-color: #2c3f68;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(27, 42, 74, 0.25);
        }
    </style>
</head>
<body>

<!-- Header Navbar -->
<nav class="navbar navbar-custom py-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-shield-plus text-white fs-3"></i>
            <div>
                <div class="brand-title">DentalProtect</div>
                <div class="contact-info">คลินิกทันตกรรมเดนทัลโพรเทค</div>
            </div>
        </div>
        <div class="d-none d-md-flex align-items-center gap-3 text-white">
            <small><i class="bi bi-telephone-fill me-1"></i> 065-513-8166</small>
            <small><i class="bi bi-line me-1"></i> @dentalprotect</small>
        </div>
    </div>
</nav>

<!-- Content Area -->
<div class="container my-5" style="max-width: 580px;">
    <div class="card card-form">
        <div class="card-header-custom">
            <i class="bi bi-calendar2-check fs-1 d-block mb-2"></i>
            <h4 class="fw-bold mb-1">ลงทะเบียนจองคิวรับบริการ</h4>
            <p class="small text-white-50 mb-0">กรอกข้อมูลผู้ป่วยเพื่อออกหมายเลขคิวรับบริการ</p>
        </div>

        <div class="card-body p-4 p-md-5">
            <form action="/queues/book" method="post">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-person me-1"></i> ชื่อ - นามสกุล ผู้ป่วย</label>
                    <input type="text" name="name" class="form-control" required placeholder="ตัวอย่าง: นายสมชาย ใจดี">
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-telephone me-1"></i> เบอร์โทรศัพท์ติดต่อนัดหมาย</label>
                    <input type="tel" name="phone" class="form-control" required placeholder="ตัวอย่าง: 0855617962">
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-card-heading me-1"></i> สิทธิการรักษา</label>
                    <select name="coverageType" class="form-select" required>
                        <option value="DIRECT_PAY">ชำระเงินเอง / สิทธิทั่วไป (ราคาปกติ)</option>
                        <option value="SOCIAL_SECURITY">สิทธิประกันสังคม (ส่วนลดสูงสุด 900 บาท)</option>
                        <option value="CIVIL_SERVANT">สิทธิข้าราชการ (รับส่วนลด 30%)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label"><i class="bi bi-journal-medical me-1"></i> ประเภทบริการทางทันตกรรม</label>
                    <select name="serviceType" class="form-select" required>
                        <option value="CHECKUP">ตรวจสุขภาพฟันและช่องปาก (รหัสคิว A | 500 บาท)</option>
                        <option value="SCALING">ขูดหินปูนและทำความสะอาด (รหัสคิว B | 1,200 บาท)</option>
                        <option value="WISDOM_TOOTH">ผ่าฟันครุฑ / ศัลยศาสตร์ช่องปาก (รหัสคิว C | 3,500 บาท)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-submit mb-3">
                    <i class="bi bi-check-circle-fill me-1"></i> ยืนยันการจองคิว
                </button>

                <div class="text-center">
                    <a href="/queues" class="text-decoration-none text-muted small">
                        <i class="bi bi-arrow-left me-1"></i> ย้อนกลับไปหน้าตรวจสอบรายการคิว
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
