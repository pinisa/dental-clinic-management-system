<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองคิวสำเร็จ | DentalProtect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">
<nav class="bg-slate-900 text-white shadow-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <a href="/" class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-blue-600 to-teal-400 p-2 rounded-xl shadow-md">
                    <img src="/images/tooth-logo.svg" alt="DentalProtect" class="w-8 h-8">
                </div>
                <div>
                    <span class="font-bold text-xl tracking-wide">DentalProtect</span>
                    <span class="text-[10px] text-teal-400 block -mt-1 uppercase tracking-widest font-semibold">Dental Clinic</span>
                </div>
            </a>
            <a href="/queues" class="text-slate-300 hover:text-white text-sm font-medium">ตรวจสอบคิว</a>
        </div>
    </div>
</nav>

<main class="max-w-2xl mx-auto px-4 py-12">
    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-7 md:p-10 text-center">
        <div class="w-20 h-20 mx-auto rounded-full bg-emerald-100 flex items-center justify-center">
            <i class="fa-solid fa-check text-3xl text-emerald-600"></i>
        </div>
        <p class="text-sm font-bold text-emerald-600 mt-5">BOOKING CONFIRMED</p>
        <h1 class="text-3xl font-black text-slate-800 mt-1">จองคิวสำเร็จ!</h1>
        <p class="text-sm text-slate-500 mt-2">กรุณาจำหมายเลขคิวของคุณและมาตามเวลาที่คลินิกกำหนด</p>

        <div class="mt-7 rounded-2xl bg-blue-50 border border-blue-100 p-6">
            <p class="text-xs font-bold text-blue-500 uppercase tracking-wider">หมายเลขคิว</p>
            <p class="text-5xl font-black text-blue-700 mt-1" th:text="${queue.queueNumber}">Q0001</p>
        </div>

        <div class="mt-6 text-left divide-y divide-slate-100 border border-slate-200 rounded-2xl overflow-hidden">
            <div class="flex justify-between gap-4 px-5 py-4">
                <span class="text-sm text-slate-500">ผู้รับบริการ</span>
                <span class="text-sm font-bold text-slate-800" th:text="${queue.patientName}">-</span>
            </div>
            <div class="flex justify-between gap-4 px-5 py-4">
                <span class="text-sm text-slate-500">บริการ</span>
                <span class="text-sm font-bold text-slate-800" th:text="${queue.serviceType}">-</span>
            </div>
            <div class="flex justify-between gap-4 px-5 py-4">
                <span class="text-sm text-slate-500">ทันตแพทย์ที่ระบบจัดให้</span>
                <span class="text-sm font-bold text-slate-800" th:text="${queue.dentistName}">-</span>
            </div>
            <div class="flex justify-between gap-4 px-5 py-4">
                <span class="text-sm text-slate-500">ค่าบริการโดยประมาณ</span>
                <span class="text-sm font-bold text-slate-800" th:text="${queue.finalPrice != null ? #numbers.formatDecimal(queue.finalPrice, 1, 2) + ' บาท' : '-'}">-</span>
            </div>
            <div class="flex justify-between gap-4 px-5 py-4">
                <span class="text-sm text-slate-500">สถานะ</span>
                <span class="text-sm font-bold text-amber-600">รอเรียกคิว</span>
            </div>
        </div>

        <div class="mt-7 flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/queues" class="px-5 py-3 rounded-xl border border-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-50">ตรวจสอบคิว</a>
            <a href="/queues/new" class="px-5 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm hover:bg-blue-700">จองคิวใหม่</a>
        </div>
    </div>
</main>
</body>
</html>
