<!DOCTYPE html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>จัดการผู้ป่วย</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:#10243a;color:white;padding:18px max(22px,calc((100% - 900px)/2))}.wrap{max-width:900px;margin:auto;padding:28px 22px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:9px;padding:11px;font:inherit;background:white}textarea{min-height:90px}.btn{background:#2563eb;color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.muted{color:#64748b;font-size:14px}.error{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:8px;margin-bottom:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.actions a{padding:11px 15px;color:#334155}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="admin-nav" style="display:flex;gap:8px;flex-wrap:wrap;padding:12px max(22px,calc((100% - 1120px)/2));background:#eaf0f7;border-bottom:1px solid #dbe4ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin">ภาพรวม</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/patients">ผู้ป่วย</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/dentists">ทันตแพทย์</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/appointments">นัดหมาย</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/queues">คิวบริการ</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/treatments">ประวัติการรักษา</a></nav><header class="top"><b>Dental Clinic • Admin</b></header><main class="wrap"><a href="/patients" class="muted">← กลับทะเบียนผู้ป่วย</a><h1 th:text="${patientId == null ? 'ลงทะเบียนผู้ป่วย' : 'แก้ไขข้อมูลผู้ป่วย'}">ลงทะเบียนผู้ป่วย</h1><p class="muted">ข้อมูลนี้จะบันทึกทั้งตาราง patients และ patient_profiles ผ่านความสัมพันธ์ของระบบ</p><form class="card" th:action="@{/patients}" th:object="${patientRequest}" method="post"><input type="hidden" name="patientId" th:value="${patientId}"><div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div><div class="grid"><div><label>ชื่อ-นามสกุล *</label><input th:field="*{name}" required maxlength="100"><p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p></div><div><label>เบอร์โทรศัพท์ *</label><input th:field="*{phone}" required inputmode="numeric" pattern="[0-9]{9,10}" maxlength="10"><p class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p></div><div><label>อีเมล</label><input th:field="*{email}" type="email"></div><div><label>สิทธิการรักษา *</label><select th:field="*{coverageType}" required><option value="">-- เลือกสิทธิ --</option><option th:each="type : ${patientTypes}" th:value="${type}" th:text="${type.name() == 'DIRECT_PAY' ? 'ชำระเอง' : (type.name() == 'SOCIAL_SECURITY' ? 'ประกันสังคม' : 'ข้าราชการ')}" ></option></select></div><div><label>ผู้ติดต่อฉุกเฉิน *</label><input th:field="*{emergencyContact}" required maxlength="100"><p class="error" th:if="${#fields.hasErrors('emergencyContact')}" th:errors="*{emergencyContact}"></p></div><div><label>ประวัติแพ้ยา/สาร</label><textarea th:field="*{allergies}" maxlength="255"></textarea></div><div style="grid-column:1/-1"><label>ประวัติสุขภาพ/การรักษาที่เกี่ยวข้อง</label><textarea th:field="*{medicalHistory}"></textarea></div></div><div class="actions"><a href="/patients">ยกเลิก</a><button class="btn" type="submit">บันทึกข้อมูล</button></div></form></main></body></html>
