<!DOCTYPE html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ทะเบียนผู้ป่วย</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:#10243a;color:white;padding:18px max(22px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1120px;margin:auto;padding:28px 22px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}h1{margin:0 0 5px}.muted{color:#64748b;font-size:14px}.btn{background:#2563eb;color:#fff;text-decoration:none;border:0;border-radius:9px;padding:10px 14px;display:inline-block;cursor:pointer;font-weight:700}.flash{padding:12px;background:#dcfce7;color:#166534;border-radius:9px;margin-bottom:15px}.table{background:white;border:1px solid #e2e8f0;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf1f6;font-size:13px}th{background:#f8fafc;color:#64748b}td a{color:#2563eb}@media(max-width:600px){.row{align-items:start;flex-direction:column}}</style></head><body><nav class="admin-nav" style="display:flex;gap:8px;flex-wrap:wrap;padding:12px max(22px,calc((100% - 1120px)/2));background:#eaf0f7;border-bottom:1px solid #dbe4ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin">ภาพรวม</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/patients">ผู้ป่วย</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/dentists">ทันตแพทย์</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/appointments">นัดหมาย</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/queues">คิวบริการ</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/treatments">ประวัติการรักษา</a></nav><header class="top"><b>Dental Clinic • Admin</b><a href="/admin" style="color:#fff">กลับ Dashboard</a></header><main class="wrap"><div class="row"><div><h1>ทะเบียนผู้ป่วย</h1><div class="muted">ข้อมูลผู้ป่วยและโปรไฟล์สุขภาพที่จำเป็นต่อการรักษา</div></div><a class="btn" href="/patients/new">+ เพิ่มผู้ป่วย</a></div><div th:if="${successMessage}" class="flash" th:text="${successMessage}"></div><div class="table"><table><thead><tr><th>ID</th><th>ชื่อ-นามสกุล</th><th>โทรศัพท์</th><th>อีเมล</th><th>สิทธิรักษา</th><th>จัดการ</th></tr></thead><tbody><tr th:each="p : ${patients}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${p.phone}"></td><td th:text="${p.email != null ? p.email : '-'}"></td><td th:text="${p.coverageType}"></td><td><a th:href="@{'/patients/' + ${p.id} + '/edit'}">แก้ไขข้อมูล</a></td></tr><tr th:if="${#lists.isEmpty(patients.content)}"><td colspan="6">ยังไม่มีข้อมูลผู้ป่วย</td></tr></tbody></table></div></main></body></html>
