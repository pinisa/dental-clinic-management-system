<!DOCTYPE html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>สร้างคิว</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:#10243a;color:white;padding:18px 24px}.wrap{max-width:760px;margin:auto;padding:28px 22px}.card{background:white;border:1px solid #e2e8f0;border-radius:15px;padding:24px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.btn{background:#2563eb;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;margin-top:18px}.muted{color:#64748b;font-size:14px}.error{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:8px}</style></head><body><nav class="admin-nav" style="display:flex;gap:8px;flex-wrap:wrap;padding:12px max(22px,calc((100% - 1120px)/2));background:#eaf0f7;border-bottom:1px solid #dbe4ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin">ภาพรวม</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/patients">ผู้ป่วย</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/dentists">ทันตแพทย์</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/appointments">นัดหมาย</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/queues">คิวบริการ</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/treatments">ประวัติการรักษา</a></nav><header class="top"><b>Dental Clinic • Admin</b></header><main class="wrap"><a href="/queues" class="muted">← กลับรายการคิว</a><h1>สร้างคิวรับบริการ</h1><p class="muted">สำหรับผู้ป่วยที่มารับบริการและต้องเข้าคิวในคลินิก</p><form class="card" th:action="@{/admin/queues}" th:object="${queueRequest}" method="post"><div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div><label>ผู้ป่วย *</label><select th:field="*{patientId}" required><option value="">-- เลือกผู้ป่วย --</option><option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name + ' • ' + p.phone}"></option></select><label>ทันตแพทย์ *</label><select th:field="*{dentistId}" required><option value="">-- เลือกทันตแพทย์ --</option><option th:each="d : ${dentists}" th:value="${d.id}" th:text="${d.name + ' • ' + d.specialization}"></option></select><label>ประเภทบริการ *</label><select th:field="*{serviceType}" required><option value="">-- เลือกบริการ --</option><option value="CHECKUP">ตรวจสุขภาพฟัน</option><option value="CLEANING">ขูดหินปูน</option><option value="FILLING">อุดฟัน</option><option value="EXTRACTION">ถอนฟัน</option><option value="ORTHODONTICS">จัดฟัน</option><option value="OTHER">อื่น ๆ</option></select><label>ราคาก่อนใช้สิทธิ (บาท) *</label><input type="number" min="0" step="0.01" th:field="*{basePrice}" required><p class="muted">ระบบคำนวณราคาสุทธิตามสิทธิการรักษาของผู้ป่วย</p><button class="btn" type="submit">สร้างคิว</button></form></main></body></html>
