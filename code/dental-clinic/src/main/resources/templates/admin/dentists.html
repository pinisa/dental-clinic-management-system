<!DOCTYPE html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ข้อมูลทันตแพทย์</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:#10243a;color:white;padding:18px max(22px,calc((100% - 1000px)/2));display:flex;justify-content:space-between}.wrap{max-width:1000px;margin:auto;padding:28px 22px}.muted{color:#64748b;font-size:14px}.table{background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf1f6;font-size:14px}th{background:#f8fafc;color:#64748b}</style></head><body><nav class="admin-nav" style="display:flex;gap:8px;flex-wrap:wrap;padding:12px max(22px,calc((100% - 1120px)/2));background:#eaf0f7;border-bottom:1px solid #dbe4ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin">ภาพรวม</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/patients">ผู้ป่วย</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/dentists">ทันตแพทย์</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/appointments">นัดหมาย</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/queues">คิวบริการ</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/treatments">ประวัติการรักษา</a></nav><header class="top"><b>Dental Clinic • Admin</b><a href="/admin" style="color:white">กลับ Dashboard</a></header><main class="wrap"><h1>ข้อมูลทันตแพทย์</h1><p class="muted">จัดการรายชื่อทันตแพทย์สำหรับการเลือกนัดหมายและสร้างคิว รายชื่อเริ่มต้นถูก seed เฉพาะเมื่อยังไม่มีข้อมูลในตาราง</p><div class="table"><table><thead><tr><th>ID</th><th>ชื่อ</th><th>ความเชี่ยวชาญ</th><th>เลขใบอนุญาต</th></tr></thead><tbody><tr th:each="d : ${dentists}"><td th:text="${d.id}"></td><td th:text="${d.name}"></td><td th:text="${d.specialization}"></td><td th:text="${d.licenseNumber}"></td></tr><tr th:if="${#lists.isEmpty(dentists)}"><td colspan="4">ยังไม่มีข้อมูลทันตแพทย์</td></tr></tbody></table></div></main></body></html>
