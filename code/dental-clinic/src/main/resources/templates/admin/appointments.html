<!DOCTYPE html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>นัดหมาย</title><style>body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{background:#10243a;color:white;padding:18px max(22px,calc((100% - 1120px)/2));display:flex;justify-content:space-between}.wrap{max-width:1120px;margin:auto;padding:28px 22px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.muted{color:#64748b;font-size:14px}.btn{background:#2563eb;color:white;text-decoration:none;border:0;border-radius:9px;padding:9px 13px;display:inline-block;cursor:pointer;font-weight:700}.table{background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:auto}table{width:100%;min-width:760px;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf1f6;font-size:13px}th{background:#f8fafc;color:#64748b}.flash{background:#dcfce7;color:#166534;padding:12px;border-radius:9px;margin-bottom:15px}</style></head><body><nav class="admin-nav" style="display:flex;gap:8px;flex-wrap:wrap;padding:12px max(22px,calc((100% - 1120px)/2));background:#eaf0f7;border-bottom:1px solid #dbe4ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin">ภาพรวม</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/patients">ผู้ป่วย</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/dentists">ทันตแพทย์</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/appointments">นัดหมาย</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/queues">คิวบริการ</a><a style="background:white;border:1px solid #dbe4ef;border-radius:8px;padding:8px 11px;color:#17324d;text-decoration:none;font-size:13px;font-weight:700" href="/admin/treatments">ประวัติการรักษา</a></nav><header class="top"><b>Dental Clinic • Admin</b><a href="/admin" style="color:white">กลับ Dashboard</a></header><main class="wrap"><div class="row"><div><h1>จัดการนัดหมาย</h1><p class="muted">นัดหมายต้องเลือกผู้ป่วยและทันตแพทย์ที่มีอยู่จริง และไม่สามารถจองทันตแพทย์คนเดิมในเวลาเดียวกันได้</p></div><a class="btn" href="/admin/appointments/new">+ สร้างนัดหมาย</a></div><div th:if="${successMessage}" class="flash" th:text="${successMessage}"></div><div class="table"><table><thead><tr><th>วันเวลา</th><th>ผู้ป่วย</th><th>ทันตแพทย์</th><th>บริการ</th><th>สถานะ</th><th>การจัดการ</th></tr></thead><tbody><tr th:each="a : ${appointments}"><td th:text="${#temporals.format(a.appointmentDateTime,'dd/MM/yyyy HH:mm')}"></td><td th:text="${a.patientName}"></td><td th:text="${a.dentistName}"></td><td th:text="${a.serviceType}"></td><td th:text="${a.status}"></td><td><form th:if="${a.status.name() != 'CANCELLED'}" th:action="@{'/admin/appointments/' + ${a.id} + '/cancel'}" method="post"><button class="btn" type="submit">ยกเลิกนัด</button></form><span th:if="${a.status.name() == 'CANCELLED'}">-</span></td></tr><tr th:if="${#lists.isEmpty(appointments)}"><td colspan="6">ยังไม่มีนัดหมาย</td></tr></tbody></table></div></main></body></html>
